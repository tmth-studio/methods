<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1408" viewBox="0 0 780 1408"><rect width="780" height="1408" fill="#FBFAF8"/><rect x="22" y="22" width="736" height="244" rx="10" fill="#F1EDE6" stroke="#C4B9A8" stroke-width="1.5"/><text x="44" y="56" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">SITUATION</text><text x="44" y="77" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">N proposition features on the roadmap;</text><text x="44" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">finite build and launch capacity this cycle.</text><text x="44" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">COMPLICATION</text><text x="44" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">They cannot all ship. Choosing by conviction</text><text x="44" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">risks spending the cycle on features that</text><text x="44" y="193" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">will not pay back.</text><text x="44" y="225" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">QUESTION</text><text x="44" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Which features do we launch, and in what order?</text><line x1="390.0" y1="266" x2="390.0" y2="292" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,285 396.0,285 390.0,294" fill="#9BAAB3"/><rect x="22" y="300" width="736" height="142" rx="12" fill="#2F4858"/><text x="390.0" y="330" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#9EC3D4" text-anchor="middle" letter-spacing="2">ANSWER  ·  GOVERNING THOUGHT</text><text x="390.0" y="362" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Launch A and C this cycle.</text><text x="390.0" y="392" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Stage B behind a capability build.</text><text x="390.0" y="422" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="24" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Drop D and E.</text><line x1="390.0" y1="442" x2="390.0" y2="472" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,465 396.0,465 390.0,474" fill="#9BAAB3"/><rect x="22" y="480" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 492 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="508" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="2">KEY LINE 1</text><text x="44" y="535" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Only A and C show proven</text><text x="44" y="562" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">customer pull</text><circle cx="52" cy="604" r="3.2" fill="#8FA9B5"/><text x="68" y="610" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">OCV score by feature, ranked across all N</text><circle cx="52" cy="634" r="3.2" fill="#8FA9B5"/><text x="68" y="640" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Where the threshold sits, and why</text><circle cx="52" cy="664" r="3.2" fill="#8FA9B5"/><text x="68" y="670" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Evidence behind the scores: base, sample, recency</text><circle cx="52" cy="694" r="3.2" fill="#8FA9B5"/><text x="68" y="700" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Why D and E fell out — stated, not implied</text><rect x="22" y="740" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 752 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="768" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="2">KEY LINE 2</text><text x="44" y="795" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Their economics hold up</text><text x="44" y="822" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">over the long run</text><circle cx="52" cy="864" r="3.2" fill="#8FA9B5"/><text x="68" y="870" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Base-case revenue and margin per surviving feature</text><circle cx="52" cy="894" r="3.2" fill="#8FA9B5"/><text x="68" y="900" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Discounted for time-to-launch and delivery confidence</text><circle cx="52" cy="924" r="3.2" fill="#8FA9B5"/><text x="68" y="930" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Zook's 3 checks: does the advantage repeat, or erode?</text><circle cx="52" cy="954" r="3.2" fill="#8FA9B5"/><text x="68" y="960" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">What would have to be true to change the call</text><rect x="22" y="1000" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 1012 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="1028" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="2">KEY LINE 3</text><text x="44" y="1055" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Nothing in delivery</text><text x="44" y="1082" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">breaks them</text><circle cx="52" cy="1124" r="3.2" fill="#8FA9B5"/><text x="68" y="1130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Capabilities each feature requires</text><circle cx="52" cy="1154" r="3.2" fill="#8FA9B5"/><text x="68" y="1160" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Have / buy / build, per capability</text><circle cx="52" cy="1184" r="3.2" fill="#8FA9B5"/><text x="68" y="1190" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Time-to-launch + confidence band</text><circle cx="52" cy="1214" r="3.2" fill="#8FA9B5"/><text x="68" y="1220" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Dependencies and gating risks — why B is staged</text><path d="M 728 1184 H 768 V 894 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,894 739,888.5 739,899.5" fill="#C9A227"/><text x="762" y="1039.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 1039.0)">feeds the discount</text><line x1="390.0" y1="1244" x2="390.0" y2="1274" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,1267 396.0,1267 390.0,1276" fill="#9BAAB3"/><rect x="22" y="1282" width="736" height="104" rx="12" fill="#C9A227" stroke="#9C7C15" stroke-width="1.5"/><text x="390.0" y="1312" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5E4A08" text-anchor="middle" letter-spacing="2">SO WHAT</text><text x="390.0" y="1342" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Sequencing, owners, and the</text><text x="390.0" y="1369" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">decisions needed this week.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1523" viewBox="0 0 780 1523"><rect width="780" height="1523" fill="#FBFAF8"/><rect x="22" y="22" width="736" height="265" rx="10" fill="#F1EDE6" stroke="#C4B9A8" stroke-width="1.5"/><text x="44" y="56" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">SITUATION</text><text x="44" y="77" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">The bank serves exporting SMEs.</text><text x="44" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Five features compete for one build cycle.</text><text x="44" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">COMPLICATION</text><text x="44" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">They cannot all ship. And a feature list is not a</text><text x="44" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">proposition — price, incentives, memory and the</text><text x="44" y="193" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">build-or-partner choice decide what it earns.</text><text x="44" y="214" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Chosen on gut feel, the cycle is wasted.</text><text x="44" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">QUESTION</text><text x="44" y="267" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">What proposition do we take to exporting SMEs?</text><line x1="390.0" y1="287" x2="390.0" y2="313" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,306 396.0,306 390.0,315" fill="#9BAAB3"/><rect x="22" y="321" width="736" height="172" rx="12" fill="#2F4858"/><text x="390.0" y="351" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#9EC3D4" text-anchor="middle" letter-spacing="2">ANSWER  ·  GOVERNING THOUGHT</text><text x="390.0" y="383" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Take 'Trade Ready' to exporting SMEs:</text><text x="390.0" y="413" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">FX payments and invoice finance, with a switch</text><text x="390.0" y="443" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">incentive. Build FX; partner for invoice finance.</text><text x="390.0" y="473" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">£6m a year by year 3. Drop crypto and rewards.</text><line x1="390.0" y1="493" x2="390.0" y2="523" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,516 396.0,516 390.0,525" fill="#9BAAB3"/><rect x="22" y="531" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 543 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="559" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 1 · DEMAND</text><text x="44" y="586" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Exporters want it — and will</text><text x="44" y="613" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">think of us when the need hits</text><circle cx="52" cy="655" r="3.2" fill="#8FA9B5"/><text x="68" y="661" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Demand scores: FX 78, invoice finance 72 — gate is 60</text><circle cx="52" cy="685" r="3.2" fill="#8FA9B5"/><text x="68" y="691" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Crypto (41) and rewards (33) fall well short</text><circle cx="52" cy="715" r="3.2" fill="#8FA9B5"/><text x="68" y="721" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Evidence: 320 exporter interviews; limits stated</text><circle cx="52" cy="745" r="3.2" fill="#8FA9B5"/><text x="68" y="751" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">'Trade Ready' name: recalled at the first export order</text><rect x="22" y="791" width="736" height="274" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 803 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="819" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 2 · ECONOMICS</text><text x="44" y="846" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">It pays: £6m a year at 40%</text><text x="44" y="873" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">margin, after delivery timing</text><circle cx="52" cy="915" r="3.2" fill="#8FA9B5"/><text x="68" y="921" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Base case: £4m a year from the two features</text><circle cx="52" cy="945" r="3.2" fill="#8FA9B5"/><text x="68" y="951" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Levers add £3m; the incentive costs £0.7m back</text><circle cx="52" cy="975" r="3.2" fill="#8FA9B5"/><text x="68" y="981" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Incentives only where a free default cannot work</text><circle cx="52" cy="1005" r="3.2" fill="#8FA9B5"/><text x="68" y="1011" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Returns discounted for each route's timing</text><circle cx="52" cy="1035" r="3.2" fill="#8FA9B5"/><text x="68" y="1041" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Built in-house, invoice finance would miss the hurdle</text><rect x="22" y="1081" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 1093 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="1109" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 3 · DELIVERY</text><text x="44" y="1136" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">We can ship it, and the</text><text x="44" y="1163" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">advantage stays ours</text><circle cx="52" cy="1205" r="3.2" fill="#8FA9B5"/><text x="68" y="1211" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">FX built in-house — it deepens our core platform</text><circle cx="52" cy="1235" r="3.2" fill="#8FA9B5"/><text x="68" y="1241" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Invoice finance partnered: live in 5 months, not 18</text><circle cx="52" cy="1265" r="3.2" fill="#8FA9B5"/><text x="68" y="1271" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Partner terms: we keep the customer and the data</text><circle cx="52" cy="1295" r="3.2" fill="#8FA9B5"/><text x="68" y="1301" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Review at 5,000 users: bring it in-house, or stay</text><path d="M 728 1235 H 768 V 1005 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,1005 739,999.5 739,1010.5" fill="#C9A227"/><text x="762" y="1120.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 1120.0)">feeds the discount</text><line x1="390.0" y1="1325" x2="390.0" y2="1355" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,1348 396.0,1348 390.0,1357" fill="#9BAAB3"/><rect x="22" y="1363" width="736" height="104" rx="12" fill="#C9A227" stroke="#9C7C15" stroke-width="1.5"/><text x="390.0" y="1393" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5E4A08" text-anchor="middle" letter-spacing="2">SO WHAT</text><text x="390.0" y="1423" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Approve the build. Sign the partner terms.</text><text x="390.0" y="1450" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Stop crypto and rewards. Owners and dates set.</text><text x="390.0" y="1491" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8B8578" text-anchor="middle" letter-spacing="0">Worked example with dummy numbers — replace every name and figure with your own.</text></svg>
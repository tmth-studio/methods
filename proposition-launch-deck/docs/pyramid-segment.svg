<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1459" viewBox="0 0 780 1459"><rect width="780" height="1459" fill="#FBFAF8"/><rect x="22" y="22" width="736" height="265" rx="10" fill="#F1EDE6" stroke="#C4B9A8" stroke-width="1.5"/><text x="44" y="56" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">SITUATION</text><text x="44" y="77" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">The bank serves [segment]. N candidate features;</text><text x="44" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">fixed capacity and an earnings mandate this cycle.</text><text x="44" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">COMPLICATION</text><text x="44" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">They cannot all ship — and a feature list is not</text><text x="44" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">a proposition. What it earns turns on price,</text><text x="44" y="193" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">incentives, memory and delivery route; chosen</text><text x="44" y="214" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">by conviction, the cycle is spent on the wrong one.</text><text x="44" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">QUESTION</text><text x="44" y="267" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">What proposition do we take to [segment]?</text><line x1="390.0" y1="287" x2="390.0" y2="313" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,306 396.0,306 390.0,315" fill="#9BAAB3"/><rect x="22" y="321" width="736" height="142" rx="12" fill="#2F4858"/><text x="390.0" y="351" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#9EC3D4" text-anchor="middle" letter-spacing="2">ANSWER  ·  GOVERNING THOUGHT</text><text x="390.0" y="383" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Take [P] to [segment]: A and C, configured</text><text x="390.0" y="413" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">[levers] under [wrapper], A built, C partnered —</text><text x="390.0" y="443" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">[£X]m at [Y]% margin by year 3. Drop D and E.</text><line x1="390.0" y1="463" x2="390.0" y2="493" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,486 396.0,486 390.0,495" fill="#9BAAB3"/><rect x="22" y="501" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 513 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="529" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 1 · DEMAND</text><text x="44" y="556" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">[Segment] will take it up: proven</text><text x="44" y="583" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">pull, made present at the moment</text><circle cx="52" cy="625" r="3.2" fill="#8FA9B5"/><text x="68" y="631" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">OCV score by feature: A and C clear the gate</text><circle cx="52" cy="655" r="3.2" fill="#8FA9B5"/><text x="68" y="661" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Threshold and evidence base — limits stated</text><circle cx="52" cy="685" r="3.2" fill="#8FA9B5"/><text x="68" y="691" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Why D and E fell out — stated, not implied</text><circle cx="52" cy="715" r="3.2" fill="#8FA9B5"/><text x="68" y="721" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">The wrapper closes the entry-point memory gap</text><rect x="22" y="761" width="736" height="274" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 773 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="789" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 2 · ECONOMICS</text><text x="44" y="816" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">It pays: [£X]m at [Y]% margin,</text><text x="44" y="843" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">after the route timing is priced</text><circle cx="52" cy="885" r="3.2" fill="#8FA9B5"/><text x="68" y="891" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Base earnings per surviving feature</text><circle cx="52" cy="915" r="3.2" fill="#8FA9B5"/><text x="68" y="921" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Bridge: levers + wrapper add, net of their cost</text><circle cx="52" cy="945" r="3.2" fill="#8FA9B5"/><text x="68" y="951" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Incentives only where they beat defaults</text><circle cx="52" cy="975" r="3.2" fill="#8FA9B5"/><text x="68" y="981" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">NPV discounted for route timing</text><circle cx="52" cy="1005" r="3.2" fill="#8FA9B5"/><text x="68" y="1011" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Built-instead counterfactual prices the choice</text><rect x="22" y="1051" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 1063 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="1079" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 3 · DELIVERY</text><text x="44" y="1106" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Delivery holds, and the</text><text x="44" y="1133" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">advantage stays ours</text><circle cx="52" cy="1175" r="3.2" fill="#8FA9B5"/><text x="68" y="1181" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Build A, partner C — inside the window</text><circle cx="52" cy="1205" r="3.2" fill="#8FA9B5"/><text x="68" y="1211" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Time-to-launch + confidence band</text><circle cx="52" cy="1235" r="3.2" fill="#8FA9B5"/><text x="68" y="1241" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Partner bounds: what they hold, what we keep</text><circle cx="52" cy="1265" r="3.2" fill="#8FA9B5"/><text x="68" y="1271" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Re-internalise trigger, with its review date</text><path d="M 728 1205 H 768 V 975 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,975 739,969.5 739,980.5" fill="#C9A227"/><text x="762" y="1090.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 1090.0)">feeds the discount</text><line x1="390.0" y1="1295" x2="390.0" y2="1325" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,1318 396.0,1318 390.0,1327" fill="#9BAAB3"/><rect x="22" y="1333" width="736" height="104" rx="12" fill="#C9A227" stroke="#9C7C15" stroke-width="1.5"/><text x="390.0" y="1363" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5E4A08" text-anchor="middle" letter-spacing="2">SO WHAT</text><text x="390.0" y="1393" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Approve the build · sign the partner terms · fund</text><text x="390.0" y="1420" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">B's re-entry · stop D and E — owners and dates.</text></svg>
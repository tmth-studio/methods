<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1450" viewBox="0 0 780 1450"><rect width="780" height="1450" fill="#FBFAF8"/><rect x="22" y="22" width="736" height="286" rx="10" fill="#F1EDE6" stroke="#C4B9A8" stroke-width="1.5"/><text x="44" y="56" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">SITUATION</text><text x="44" y="77" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">The bank serves [segment]. N candidate features;</text><text x="44" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">fixed capacity and an earnings mandate this cycle.</text><text x="44" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">COMPLICATION</text><text x="44" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">They cannot all ship — and features alone do not</text><text x="44" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">set earnings. Price, incentives and build-vs-partner</text><text x="44" y="193" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">change what each returns. Decided separately,</text><text x="44" y="214" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">they get decided inconsistently.</text><text x="44" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">QUESTION</text><text x="44" y="267" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Which features do we take to [segment],</text><text x="44" y="288" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">configured how, and delivered how?</text><line x1="390.0" y1="308" x2="390.0" y2="334" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,327 396.0,327 390.0,336" fill="#9BAAB3"/><rect x="22" y="342" width="736" height="142" rx="12" fill="#2F4858"/><text x="390.0" y="372" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#9EC3D4" text-anchor="middle" letter-spacing="2">ANSWER  ·  GOVERNING THOUGHT</text><text x="390.0" y="404" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Launch A and C. Configure: price move + targeted</text><text x="390.0" y="434" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">incentive, [wrapper] over the proposition.</text><text x="390.0" y="464" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Deliver A in-house, C via [partner]. Drop D and E.</text><line x1="390.0" y1="484" x2="390.0" y2="514" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,507 396.0,507 390.0,516" fill="#9BAAB3"/><rect x="22" y="522" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 534 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="550" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">DECISION 1 · THE RIGHT FEATURES</text><text x="44" y="577" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Only A and C show proven</text><text x="44" y="604" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">customer pull</text><circle cx="52" cy="646" r="3.2" fill="#8FA9B5"/><text x="68" y="652" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">OCV score by feature, ranked across all N</text><circle cx="52" cy="676" r="3.2" fill="#8FA9B5"/><text x="68" y="682" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Where the threshold sits, and why</text><circle cx="52" cy="706" r="3.2" fill="#8FA9B5"/><text x="68" y="712" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Evidence base — and its stated limits</text><circle cx="52" cy="736" r="3.2" fill="#8FA9B5"/><text x="68" y="742" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Why D and E fell out — stated, not implied</text><rect x="22" y="782" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 794 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="810" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">DECISION 2 · THE CONFIGURATION THAT PAYS</text><text x="44" y="837" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Levers + wrapper add [£X]m</text><text x="44" y="864" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">without buying dead weight</text><circle cx="52" cy="906" r="3.2" fill="#8FA9B5"/><text x="68" y="912" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Base earnings per surviving feature</text><circle cx="52" cy="936" r="3.2" fill="#8FA9B5"/><text x="68" y="942" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Earnings bridge: what each lever adds and costs</text><circle cx="52" cy="966" r="3.2" fill="#8FA9B5"/><text x="68" y="972" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Incentives only where they beat defaults</text><circle cx="52" cy="996" r="3.2" fill="#8FA9B5"/><text x="68" y="1002" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">The wrapper: memory at the entry points</text><rect x="22" y="1042" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 1054 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="1070" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">DECISION 3 · THE ROUTE THAT SURVIVES</text><text x="44" y="1097" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Build A, partner C — shipped in</text><text x="44" y="1124" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">the window, advantage kept</text><circle cx="52" cy="1166" r="3.2" fill="#8FA9B5"/><text x="68" y="1172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Routes priced: time, margin share, control</text><circle cx="52" cy="1196" r="3.2" fill="#8FA9B5"/><text x="68" y="1202" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Partner bounds: what they hold, what we keep</text><circle cx="52" cy="1226" r="3.2" fill="#8FA9B5"/><text x="68" y="1232" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Configured NPV, discounted by route timing</text><circle cx="52" cy="1256" r="3.2" fill="#8FA9B5"/><text x="68" y="1262" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Built-instead counterfactual prices the choice</text><path d="M 728 646 H 768 V 906 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,906 739,900.5 739,911.5" fill="#C9A227"/><text x="762" y="776.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 776.0)">sets adoption</text><path d="M 728 936 H 768 V 1226 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,1226 739,1220.5 739,1231.5" fill="#C9A227"/><text x="762" y="1081.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 1081.0)">prices the route</text><line x1="390.0" y1="1286" x2="390.0" y2="1316" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,1309 396.0,1309 390.0,1318" fill="#9BAAB3"/><rect x="22" y="1324" width="736" height="104" rx="12" fill="#C9A227" stroke="#9C7C15" stroke-width="1.5"/><text x="390.0" y="1354" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5E4A08" text-anchor="middle" letter-spacing="2">SO WHAT</text><text x="390.0" y="1384" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Approve the build · sign the partner terms · fund</text><text x="390.0" y="1411" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">B's re-entry · stop D and E — owners and dates.</text></svg>
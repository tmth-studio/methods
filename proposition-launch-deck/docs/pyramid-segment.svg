<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1514" viewBox="0 0 780 1514"><rect width="780" height="1514" fill="#FBFAF8"/><rect x="22" y="22" width="736" height="286" rx="10" fill="#F1EDE6" stroke="#C4B9A8" stroke-width="1.5"/><text x="44" y="56" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">SITUATION</text><text x="44" y="77" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">The bank serves exporting SMEs. Five candidate</text><text x="44" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">features; capacity for two builds per cycle.</text><text x="44" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">COMPLICATION</text><text x="44" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">A one-off pick answers this cycle and nothing</text><text x="44" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">after it. The features differ in demand, return</text><text x="44" y="193" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">and build cost — and the evidence moves as we</text><text x="44" y="214" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">learn. Gut feel cannot hold an order.</text><text x="44" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">QUESTION</text><text x="44" y="267" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">What do we build into the exporting-SME</text><text x="44" y="288" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">proposition — and in what order?</text><line x1="390.0" y1="308" x2="390.0" y2="334" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,327 396.0,327 390.0,336" fill="#9BAAB3"/><rect x="22" y="342" width="736" height="142" rx="12" fill="#2F4858"/><text x="390.0" y="372" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#9EC3D4" text-anchor="middle" letter-spacing="2">ANSWER  ·  GOVERNING THOUGHT</text><text x="390.0" y="404" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Fill 'Trade Ready' in return order: FX and</text><text x="390.0" y="434" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">invoice finance take this cycle's two slots —</text><text x="390.0" y="464" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">£6m a year by year 3.</text><line x1="390.0" y1="484" x2="390.0" y2="514" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,507 396.0,507 390.0,516" fill="#9BAAB3"/><rect x="22" y="522" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 534 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="550" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 1 · DEMAND ADMITS</text><text x="44" y="577" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Demand decides what enters the</text><text x="44" y="604" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">backlog — three of five get in</text><circle cx="52" cy="646" r="3.2" fill="#8FA9B5"/><text x="68" y="652" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Demand gate is 60: FX 78, invoice finance 72, insurance 64</text><circle cx="52" cy="676" r="3.2" fill="#8FA9B5"/><text x="68" y="682" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Crypto (41) and rewards (33) leave the list for good</text><circle cx="52" cy="706" r="3.2" fill="#8FA9B5"/><text x="68" y="712" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Evidence: 320 exporter interviews; limits stated</text><circle cx="52" cy="736" r="3.2" fill="#8FA9B5"/><text x="68" y="742" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">'Trade Ready' is the standing shell features ship into</text><rect x="22" y="782" width="736" height="274" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 794 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="810" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 2 · RETURN SORTS</text><text x="44" y="837" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Return per build slot sets the</text><text x="44" y="864" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">order — FX first, insurance third</text><circle cx="52" cy="906" r="3.2" fill="#8FA9B5"/><text x="68" y="912" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Sort key: risk-adjusted return per build slot, not raw NPV</text><circle cx="52" cy="936" r="3.2" fill="#8FA9B5"/><text x="68" y="942" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">FX £2.1m a slot; invoice finance £1.6m; insurance £0.9m</text><circle cx="52" cy="966" r="3.2" fill="#8FA9B5"/><text x="68" y="972" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Levers add £3m; incentives only where defaults fail</text><circle cx="52" cy="996" r="3.2" fill="#8FA9B5"/><text x="68" y="1002" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Returns discounted for each route's timing</text><circle cx="52" cy="1026" r="3.2" fill="#8FA9B5"/><text x="68" y="1032" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Re-scored quarterly — the order moves when evidence does</text><rect x="22" y="1072" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 1084 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="1100" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 3 · CAPACITY CUTS</text><text x="44" y="1127" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Two slots this cycle set the</text><text x="44" y="1154" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">cut-line; routes keep the edge</text><circle cx="52" cy="1196" r="3.2" fill="#8FA9B5"/><text x="68" y="1202" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">This cycle: FX built in-house, invoice finance partnered</text><circle cx="52" cy="1226" r="3.2" fill="#8FA9B5"/><text x="68" y="1232" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Partnering makes invoice finance live in 5 months, not 18</text><circle cx="52" cy="1256" r="3.2" fill="#8FA9B5"/><text x="68" y="1262" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Insurance waits on the claims capability — next cycle</text><circle cx="52" cy="1286" r="3.2" fill="#8FA9B5"/><text x="68" y="1292" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Partner terms: we keep the customer and the data</text><path d="M 728 1226 H 768 V 996 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,996 739,990.5 739,1001.5" fill="#C9A227"/><text x="762" y="1111.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 1111.0)">feeds the discount</text><line x1="390.0" y1="1316" x2="390.0" y2="1346" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,1339 396.0,1339 390.0,1348" fill="#9BAAB3"/><rect x="22" y="1354" width="736" height="104" rx="12" fill="#C9A227" stroke="#9C7C15" stroke-width="1.5"/><text x="390.0" y="1384" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5E4A08" text-anchor="middle" letter-spacing="2">SO WHAT</text><text x="390.0" y="1414" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Approve the cycle-1 slate and the sorting rule.</text><text x="390.0" y="1441" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Sign the partner terms. Quarterly re-score set.</text><text x="390.0" y="1482" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8B8578" text-anchor="middle" letter-spacing="0">Worked example with dummy numbers — replace every name and figure with your own.</text></svg>
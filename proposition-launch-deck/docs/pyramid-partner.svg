<svg xmlns="http://www.w3.org/2000/svg" width="780" height="1514" viewBox="0 0 780 1514"><rect width="780" height="1514" fill="#FBFAF8"/><rect x="22" y="22" width="736" height="286" rx="10" fill="#F1EDE6" stroke="#C4B9A8" stroke-width="1.5"/><text x="44" y="56" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">SITUATION</text><text x="44" y="77" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Invoice finance cleared the demand gate and</text><text x="44" y="98" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">holds slot 2. We can build, buy, or partner.</text><text x="44" y="130" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">COMPLICATION</text><text x="44" y="151" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Built in-house it takes 18 months — after the</text><text x="44" y="172" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">renewal window in which exporters switch.</text><text x="44" y="193" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Partnering trades margin share and a moat risk</text><text x="44" y="214" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">for speed. On instinct, that trade goes unpriced.</text><text x="44" y="246" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#7A6F5C" text-anchor="start" letter-spacing="1.6">QUESTION</text><text x="44" y="267" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">Should we partner to launch invoice finance —</text><text x="44" y="288" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#3D3A34" text-anchor="start" letter-spacing="0">and on what terms?</text><line x1="390.0" y1="308" x2="390.0" y2="334" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,327 396.0,327 390.0,336" fill="#9BAAB3"/><rect x="22" y="342" width="736" height="142" rx="12" fill="#2F4858"/><text x="390.0" y="372" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#9EC3D4" text-anchor="middle" letter-spacing="2">ANSWER  ·  GOVERNING THOUGHT</text><text x="390.0" y="404" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">Partner with [Lender Co]: live in 5 months,</text><text x="390.0" y="434" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">£1.6m NPV — build misses the window;</text><text x="390.0" y="464" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="0">the terms keep the advantage ours.</text><line x1="390.0" y1="484" x2="390.0" y2="514" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,507 396.0,507 390.0,516" fill="#9BAAB3"/><rect x="22" y="522" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 534 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="550" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 1 · WORTH LAUNCHING NOW</text><text x="44" y="577" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Demand is proven — and the</text><text x="44" y="604" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">window closes in two quarters</text><circle cx="52" cy="646" r="3.2" fill="#8FA9B5"/><text x="68" y="652" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">OCV 72 against a gate of 60 — slot 2 of the backlog</text><circle cx="52" cy="676" r="3.2" fill="#8FA9B5"/><text x="68" y="682" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Two-thirds of renewal dates fall in the next two quarters</text><circle cx="52" cy="706" r="3.2" fill="#8FA9B5"/><text x="68" y="712" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Arriving at month 18 halves the modelled uptake</text><circle cx="52" cy="736" r="3.2" fill="#8FA9B5"/><text x="68" y="742" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">The £1.0m gap is a timing problem, not a build problem</text><rect x="22" y="782" width="736" height="274" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 794 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="810" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 2 · THE ROUTE WINS THE MONEY</text><text x="44" y="837" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">Partnering returns £1.0m more</text><text x="44" y="864" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">than building — all routes priced</text><circle cx="52" cy="906" r="3.2" fill="#8FA9B5"/><text x="68" y="912" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Partner £1.6m · white-label £1.1m · floor £0.9m · build £0.6m</text><circle cx="52" cy="936" r="3.2" fill="#8FA9B5"/><text x="68" y="942" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Build wins on margin (£520 vs £390 a user) — loses on time</text><circle cx="52" cy="966" r="3.2" fill="#8FA9B5"/><text x="68" y="972" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Named partner, diligenced — negatives stated, not hidden</text><circle cx="52" cy="996" r="3.2" fill="#8FA9B5"/><text x="68" y="1002" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Crossover computed: capex ÷ margin delta ≈ 5,000 users</text><circle cx="52" cy="1026" r="3.2" fill="#8FA9B5"/><text x="68" y="1032" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Do-nothing is priced too — the slot's next best use</text><rect x="22" y="1072" width="736" height="244" rx="12" fill="#FFFFFF" stroke="#CBD5DA" stroke-width="1.5"/><path d="M 22 1084 a12,12 0 0 1 12,-12 h 712 a12,12 0 0 1 12,12 v 86 h -736 z" fill="#4E7C90"/><text x="44" y="1100" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#BBD6E2" text-anchor="start" letter-spacing="1.6">KEY LINE 3 · THE DEAL IS BOUNDED</text><text x="44" y="1127" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">The terms keep the</text><text x="44" y="1154" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#FFFFFF" text-anchor="start" letter-spacing="0">advantage ours</text><circle cx="52" cy="1196" r="3.2" fill="#8FA9B5"/><text x="68" y="1202" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">We keep the customer, the data, the pricing, the brand</text><circle cx="52" cy="1226" r="3.2" fill="#8FA9B5"/><text x="68" y="1232" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Exclusivity · data on exit · 90-day portability · re-opener</text><circle cx="52" cy="1256" r="3.2" fill="#8FA9B5"/><text x="68" y="1262" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Month-2 milestone gate: slip and the deal re-opens</text><circle cx="52" cy="1286" r="3.2" fill="#8FA9B5"/><text x="68" y="1292" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="17.5" font-weight="400" fill="#33505F" text-anchor="start" letter-spacing="0">Re-internalise at ~5,000 users, checked quarterly</text><path d="M 728 996 H 768 V 1286 H 728" fill="none" stroke="#C9A227" stroke-width="2.4" stroke-dasharray="6 5"/><polygon points="728,1286 739,1280.5 739,1291.5" fill="#C9A227"/><text x="762" y="1141.0" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#8A6D0F" text-anchor="middle" transform="rotate(90 762 1141.0)">sets the trigger</text><line x1="390.0" y1="1316" x2="390.0" y2="1346" stroke="#9BAAB3" stroke-width="2.5"/><polygon points="384.0,1339 396.0,1339 390.0,1348" fill="#9BAAB3"/><rect x="22" y="1354" width="736" height="104" rx="12" fill="#C9A227" stroke="#9C7C15" stroke-width="1.5"/><text x="390.0" y="1384" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#5E4A08" text-anchor="middle" letter-spacing="2">SO WHAT</text><text x="390.0" y="1414" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Sign the bounded terms. Fund the integration.</text><text x="390.0" y="1441" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#2B2308" text-anchor="middle" letter-spacing="0">Hold slot 2. Diarise the crossover check.</text><text x="390.0" y="1482" font-family="Helvetica Neue,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#8B8578" text-anchor="middle" letter-spacing="0">Worked example with dummy numbers — replace every name and figure with your own.</text></svg>